<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AfriWear Studio – Custom African Wear Prototype</title>
<style>*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font-family:inherit}</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

const SCREENS = ["landing", "auth", "studio", "measurements", "tailors", "order", "payment", "dashboard"];

const colors = {
  orange: "#E85D04",
  brown: "#6B3A2A",
  gold: "#F4A522",
  cream: "#FDF6EC",
  dark: "#1A1A1A",

  light: "#FFF8F0",
  success: "#2D6A4F",
  border: "#E8D5C0",

const fabrics = [

  { name: "Kente", color: "#F4A522", pattern: "🟡" },

  { name: "Adire", color: "#1B4332", pattern: "🟢" },
  { name: "Dashiki", color: "#7B2D8B", pattern: "🟣" },

// ── Shared UI ──────────────────────────────────────────────────────────────

function Navbar({ screen, setScreen }) {
  return (
    <nav style={{
      position: "fixed", top: 0, left: 0, right: 0, zIndex: 100,
      background: "rgba(253,246,236,0.96)", backdropFilter: "blur(12px)",

      display: "flex", alignItems: "center", justifyContent: "space-between",
      padding: "0 32px", height: 60,
    }}>
      <div
        onClick={() => setScreen("landing")}
        style={{ cursor: "pointer", display: "flex", alignItems: "center", gap: 8 }}
      >
        <div style={{
          width: 32, height: 32, borderRadius: 8,
          background: `linear-gradient(135deg, ${colors.orange}, ${colors.gold})`,
          display: "flex", alignItems: "center", justifyContent: "center",
          fontSize: 16,
        }}>🧵</div>
        <span style={{ fontFamily: "'Playfair Display', Georgia, serif", fontSize: 18, fontWeight: 700, color: colors.dark }}>
          AfriWear<span style={{ color: colors.orange }}> Studio</span>
        </span>
      </div>

      <div style={{ display: "flex", gap: 6 }}>
        {[
          { label: "Design", screen: "studio" },
          { label: "Tailors", screen: "tailors" },
          { label: "Track", screen: "order" },
          { label: "Dashboard", screen: "dashboard" },
        ].map(item => (
          <button key={item.screen} onClick={() => setScreen(item.screen)} style={{
            padding: "6px 14px", borderRadius: 20, border: "none", cursor: "pointer",
            fontSize: 13, fontWeight: 500,
            background: screen === item.screen ? colors.orange : "transparent",
            color: screen === item.screen ? "#fff" : colors.muted,
            transition: "all 0.2s",
          }}>{item.label}</button>
        ))}
        <button onClick={() => setScreen("auth")} style={{
          padding: "6px 18px", borderRadius: 20, border: `1.5px solid ${colors.orange}`,
          background: "transparent", color: colors.orange, cursor: "pointer",
          fontSize: 13, fontWeight: 600,
        }}>Login</button>
      </div>
    </nav>
  );
}

function Tag({ children, color = colors.orange }) {
  return (
    <span style={{
      background: color + "18", color, border: `1px solid ${color}40`,
      borderRadius: 20, padding: "2px 10px", fontSize: 11, fontWeight: 600,
    }}>{children}</span>
  );
}

function Stars({ rating }) {
  return (
    <span style={{ color: colors.gold, fontSize: 13 }}>
      {"★".repeat(Math.floor(rating))}
      <span style={{ color: colors.border }}>{"★".repeat(5 - Math.floor(rating))}</span>
      <span style={{ color: colors.muted, marginLeft: 4, fontSize: 12 }}>{rating}</span>
    </span>
  );
}

// ── SCREEN: Landing ────────────────────────────────────────────────────────

          </p>

          <div style={{ display: "flex", gap: 14, justifyContent: "center", flexWrap: "wrap" }}>
            <button onClick={() => setScreen("studio")} style={{
              background: `linear-gradient(135deg, ${colors.orange}, ${colors.gold})`,
              border: "none", borderRadius: 50, padding: "16px 36px",
              color: "#fff", fontSize: 16, fontWeight: 700, cursor: "pointer",
              boxShadow: `0 8px 32px ${colors.orange}60`,
              fontFamily: "Inter, sans-serif",
            }}>
              🎨 Start Designing
            </button>
            <button onClick={() => setScreen("tailors")} style={{
              background: "transparent",
              border: "2px solid rgba(255,255,255,0.3)", borderRadius: 50,
              padding: "16px 36px", color: "#fff", fontSize: 16,
              fontWeight: 500, cursor: "pointer", fontFamily: "Inter, sans-serif",
            }}>
              Browse Tailors →

          </div>

          {/* Stats */}
          <div style={{
            display: "flex", gap: 40, justifyContent: "center", marginTop: 60,

              <div key={label} style={{ textAlign: "center" }}>
                <div style={{ color: colors.gold, fontSize: 28, fontWeight: 800 }}>{val}</div>
                <div style={{ color: "#C9A98A", fontSize: 13, fontFamily: "Inter, sans-serif" }}>{label}</div>
              </div>

          </div>
        </div>
      </section>

      <section style={{ background: colors.cream, padding: "80px 32px" }}>
        <div style={{ maxWidth: 900, margin: "0 auto" }}>

                <div style={{ color: colors.orange, fontSize: 11, fontWeight: 700, fontFamily: "Inter, sans-serif", marginBottom: 6 }}>STEP {item.step}</div>

                <div style={{ color: colors.muted, fontSize: 13, lineHeight: 1.6, fontFamily: "Inter, sans-serif" }}>{item.desc}</div>

            fontFamily: "'Playfair Display', serif",
            fontSize: 36, fontWeight: 700, color: colors.dark,

          <div style={{ textAlign: "center", marginTop: 32 }}>

// ── SCREEN: Auth ───────────────────────────────────────────────────────────

function AuthScreen({ setScreen }) {
  const [tab, setTab] = useState("login");
  const [role, setRole] = useState("client");

  return (
    <div style={{
      minHeight: "100vh", background: `linear-gradient(135deg, #1A0A04, #3D1A0A)`,
      display: "flex", alignItems: "center", justifyContent: "center",
      padding: "80px 16px",
    }}>
      <div style={{
        background: "#fff", borderRadius: 24, padding: 40,
        width: "100%", maxWidth: 420, boxShadow: "0 24px 80px rgba(0,0,0,0.4)",
      }}>
        <div style={{ textAlign: "center", marginBottom: 28 }}>
          <div style={{ fontSize: 36, marginBottom: 8 }}>🧵</div>
          <h2 style={{ fontFamily: "'Playfair Display', serif", fontSize: 24, fontWeight: 700, color: colors.dark, margin: 0 }}>
            AfriWear Studio
          </h2>
        </div>

        {/* Tab */}
        <div style={{
          display: "flex", background: colors.cream, borderRadius: 12, padding: 4, marginBottom: 24,
        }}>
          {["login", "signup"].map(t => (
            <button key={t} onClick={() => setTab(t)} style={{
              flex: 1, padding: "10px", borderRadius: 10, border: "none",
              background: tab === t ? "#fff" : "transparent",
              color: tab === t ? colors.orange : colors.muted,
              fontWeight: 600, cursor: "pointer", fontSize: 14,
              boxShadow: tab === t ? "0 2px 8px rgba(0,0,0,0.08)" : "none",
              fontFamily: "Inter, sans-serif",
              transition: "all 0.2s",
            }}>{t === "login" ? "Login" : "Sign Up"}</button>
          ))}
        </div>

        {tab === "signup" && (
          <div style={{ display: "flex", gap: 8, marginBottom: 20 }}>
            {["client", "tailor"].map(r => (
              <button key={r} onClick={() => setRole(r)} style={{
                flex: 1, padding: "10px", borderRadius: 10,
                border: `2px solid ${role === r ? colors.orange : colors.border}`,
                background: role === r ? colors.orange + "10" : "#fff",
                color: role === r ? colors.orange : colors.muted,
                fontWeight: 600, cursor: "pointer", fontSize: 13,
                fontFamily: "Inter, sans-serif",
              }}>
                {r === "client" ? "👗 I'm a Client" : "🧵 I'm a Tailor"}
              </button>
            ))}
          </div>
        )}

        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          {tab === "signup" && (
            <input placeholder="Full Name" style={inputStyle} />
          )}
          <input placeholder="Email address" type="email" style={inputStyle} />
          <input placeholder="Password" type="password" style={inputStyle} />
          {tab === "signup" && role === "tailor" && (
            <input placeholder="City / Location" style={inputStyle} />
          )}
        </div>

        {tab === "login" && (
          <div style={{ textAlign: "right", marginTop: 8 }}>
            <span style={{ color: colors.orange, fontSize: 13, cursor: "pointer", fontFamily: "Inter, sans-serif" }}>
              Forgot password?
            </span>
          </div>
        )}

        <button onClick={() => setScreen("studio")} style={{
          width: "100%", marginTop: 20, padding: "14px",
          background: `linear-gradient(135deg, ${colors.orange}, ${colors.gold})`,
          border: "none", borderRadius: 12, color: "#fff",
          fontSize: 16, fontWeight: 700, cursor: "pointer",
          fontFamily: "Inter, sans-serif",
          boxShadow: `0 4px 20px ${colors.orange}40`,
        }}>
          {tab === "login" ? "Login →" : "Create Account →"}
        </button>

        <div style={{
          display: "flex", alignItems: "center", gap: 12, margin: "20px 0",
        }}>
          <div style={{ flex: 1, height: 1, background: colors.border }} />
          <span style={{ color: colors.muted, fontSize: 12, fontFamily: "Inter, sans-serif" }}>or continue with</span>
          <div style={{ flex: 1, height: 1, background: colors.border }} />
        </div>

        <button style={{
          width: "100%", padding: "12px", border: `1.5px solid ${colors.border}`,
          borderRadius: 12, background: "#fff", cursor: "pointer",
          display: "flex", alignItems: "center", justifyContent: "center", gap: 8,
          fontSize: 14, fontFamily: "Inter, sans-serif", color: colors.dark,
        }}>
          <span>🌐</span> Continue with Google
        </button>
      </div>
    </div>
  );
}

const inputStyle = {
  width: "100%", padding: "12px 16px", borderRadius: 12,
  border: `1.5px solid ${colors.border}`, fontSize: 14,
  fontFamily: "Inter, sans-serif", color: colors.dark,
  outline: "none", boxSizing: "border-box",
  background: colors.light,
};

// ── SCREEN: Design Studio ─────────────────────────────────────────────────

function StudioScreen({ setScreen }) {
  const [selectedFabric, setSelectedFabric] = useState(0);
  const [aiPrompt, setAiPrompt] = useState("");
  const [generating, setGenerating] = useState(false);
  const [generated, setGenerated] = useState(false);
  const [tab, setTab] = useState("upload");

  const handleGenerate = () => {
    if (!aiPrompt) return;
    setGenerating(true);
    setTimeout(() => { setGenerating(false); setGenerated(true); }, 2000);
  };

  const styles = ["Gown", "Agbada", "Senator", "Jumpsuit", "Kaftan", "Boubou", "Iro & Buba"];

  return (
    <div style={{ minHeight: "100vh", background: colors.cream, paddingTop: 80 }}>
      <div style={{ maxWidth: 1100, margin: "0 auto", padding: "40px 24px" }}>
        <h1 style={{ fontFamily: "'Playfair Display', serif", fontSize: 32, fontWeight: 700, color: colors.dark, marginBottom: 4 }}>
          🎨 Design Studio
        </h1>
        <p style={{ color: colors.muted, fontFamily: "Inter, sans-serif", marginBottom: 32 }}>
          Create your perfect African outfit
        </p>

        <div style={{ display: "grid", gridTemplateColumns: "1fr 340px", gap: 24 }}>
          {/* Left: Canvas */}
          <div style={{ background: "#fff", borderRadius: 20, padding: 28, border: `1px solid ${colors.border}` }}>
            {/* Tabs */}
            <div style={{ display: "flex", gap: 4, marginBottom: 24, background: colors.cream, borderRadius: 12, padding: 4 }}>
              {["upload", "ai"].map(t => (
                <button key={t} onClick={() => setTab(t)} style={{
                  flex: 1, padding: "10px", borderRadius: 10, border: "none",
                  background: tab === t ? "#fff" : "transparent",
                  color: tab === t ? colors.orange : colors.muted,
                  fontWeight: 600, cursor: "pointer", fontSize: 14,
                  fontFamily: "Inter, sans-serif",
                  boxShadow: tab === t ? "0 2px 8px rgba(0,0,0,0.06)" : "none",
                }}>{t === "upload" ? "📁 Upload Design" : "✨ AI Generate"}</button>
              ))}
            </div>

            {tab === "upload" ? (
              <div style={{
                border: `2px dashed ${colors.border}`, borderRadius: 16,
                padding: "60px 20px", textAlign: "center", cursor: "pointer",
                background: colors.light,
              }}>
                <div style={{ fontSize: 48, marginBottom: 12 }}>🖼️</div>
                <div style={{ fontFamily: "Inter, sans-serif", fontWeight: 600, color: colors.dark, marginBottom: 6 }}>
                  Drop your design here
                </div>
                <div style={{ color: colors.muted, fontSize: 13 }}>
                  JPG, PNG, PDF accepted
                </div>
                <button style={{
                  marginTop: 20, padding: "10px 24px",
                  background: colors.orange, border: "none", borderRadius: 20,
                  color: "#fff", fontWeight: 600, cursor: "pointer",
                  fontFamily: "Inter, sans-serif",
                }}>Browse Files</button>
              </div>
            ) : (
              <div>
                <textarea
                  value={aiPrompt}
                  onChange={e => setAiPrompt(e.target.value)}
                  placeholder="Describe your outfit... e.g. 'Ankara off-shoulder gown with gold trim and flutter sleeves'"
                  style={{
                    width: "100%", minHeight: 100, padding: "14px 16px",
                    borderRadius: 12, border: `1.5px solid ${colors.border}`,
                    fontFamily: "Inter, sans-serif", fontSize: 14, color: colors.dark,
                    resize: "vertical", outline: "none", boxSizing: "border-box",
                    background: colors.light,
                  }}
                />
                {/* Style chips */}
                <div style={{ display: "flex", gap: 8, flexWrap: "wrap", margin: "12px 0" }}>
                  {styles.map(s => (
                    <span key={s} onClick={() => setAiPrompt(p => p + (p ? ", " : "") + s)} style={{
                      background: colors.cream, border: `1px solid ${colors.border}`,
                      borderRadius: 20, padding: "4px 12px", fontSize: 12,
                      cursor: "pointer", color: colors.muted,
                      fontFamily: "Inter, sans-serif",
                    }}>{s}</span>
                  ))}
                </div>

                <button onClick={handleGenerate} disabled={!aiPrompt} style={{
                  width: "100%", padding: "14px",

// ── App Root ───────────────────────────────────────────────────────────────

function App() {
  const [screen, setScreen] = useState("landing");

  const renderScreen = () => {
    switch (screen) {
      case "landing": return <LandingScreen setScreen={setScreen} />;
      case "auth": return <AuthScreen setScreen={setScreen} />;
      case "studio": return <StudioScreen setScreen={setScreen} />;
      case "measurements": return <MeasurementsScreen setScreen={setScreen} />;
      case "tailors": return <TailorsScreen setScreen={setScreen} />;
      case "order": return <OrderScreen />;
      case "payment": return <PaymentScreen setScreen={setScreen} />;
      case "dashboard": return <DashboardScreen setScreen={setScreen} />;
      default: return <LandingScreen setScreen={setScreen} />;
    }
  };

  return (
    <div style={{ fontFamily: "Inter, sans-serif", background: colors.cream, minHeight: "100vh" }}>
      <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;800&display=swap" rel="stylesheet" />
      {screen !== "auth" && <Navbar screen={screen} setScreen={setScreen} />}
      {renderScreen()}
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
